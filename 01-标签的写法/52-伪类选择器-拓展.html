<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪类选择器拓展</title>
    <style>
        a:link{
            color: red;
        }
        a:visited{
            color: blue;
        }
        a:hover{
            color: black;
        }
        a:active{
            color: brown;
        }
        /* 工作中，一个a标签选择器设置超链接的样式，hover状态特殊设置 */
    </style>
</head>
<body>
    <a href="https://www.bilibili.com/">这是测试标签</a>
</body>
</html>
