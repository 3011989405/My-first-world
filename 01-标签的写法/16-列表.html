<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列表</title>
</head>
<body>
    <ul>无序列表：
        <li>第一条</li>
        <li>第二条</li>
        <li>第三条</li>
    </ul>
    <ol>有序列表：
        <li>第一条</li>
        <li>第二条</li>
        <li>第三条</li>
    </ol>
    <dl>
        <dt>定义列表</dt>
        <dd>无序列表</dd>
        <dd>有序列表</dd>
    </dl>
</body>
</html>
