<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex伸缩比</title>
    <style>
        /* 默认情况下，主轴方向尺寸是靠内容撑开；侧轴默认拉伸 */
        .box{
            display: flex;
            flex-direction: column;

            height: 300px;
            border: 1px solid #000;
        }
        .box div{
            /* height: 100px; */
            background-color: pink
        }

        .box div:nth-child(1){
            width: 200px;
        }

        .box div:nth-child(2){
            flex: 1;
        }
        /* 第三个子级标签占全部的两份 */
        .box div:nth-child(3){
            flex: 2;
        }
    </style>
</head>
<body>
    <div class="box">
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
    </div>
</body>
</html>
