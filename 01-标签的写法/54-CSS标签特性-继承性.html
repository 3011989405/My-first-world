<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS标签特性-继承性</title>
    <style>
        body{
            font-size: 30px;
            color: red;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div>div标签</div>
    <p>p标签</p>
    <span>span标签</span>
    <a href="#">a标签</a>
    <!-- 当标签有自己的特性时他是不会继承其他特性，只继承不冲突的特性，例如h1的字大小，超链接的默认颜色 -->
    <h1>h1标签</h1>
</body>
</html>
