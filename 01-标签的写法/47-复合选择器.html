<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复合选择器</title>
    <style>
        div span{
            color: blue;
        }
    </style>
</head>
<body>
    <span>span标签</span>
    <div>
        <span>这是div里的span</span>
        <p>
            <span>这是div里p的span</span>
        </p>
    </div>
</body>
</html>
