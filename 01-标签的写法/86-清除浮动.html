 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除浮动</title>
    <style>
        .top{
            margin: 10px auto;
            width: 1200px;
            /* height: 300px; */
            background-color: pink;
            overflow: hidden;
        }

        .bottom{
            height: 100px;
            background-color: brown;
        }

        .left{
            float: left;
            width: 200px;
            height: 300px;
            background-color: skyblue;
        }

        .right{
            float: right;
            width: 950px;
            height: 300px;
            background-color: orange;
        }
        /* <!-- 额外标签法，在父级元素内容的最后添加一个块级元素，设置CSS属性clear: both; --> */
        /* .clearfix{
            clear: both;
        } */

        /* 单伪元素法 */
        /* .clearfix::after{
            content: "";
            display: block;
            clear: both;
        } */

        /* 双伪元素法 */
        /* before解决外边距塌陷问题 */
        /* .clearfix::before,
        .clearfix::after{
            content: "";
            display: table;
        }
        /* after:清除浮动影响 */
        /* .clearfix::after{
            clear: both;
        } */ 
    </style>
 </head>
 <body>
    <!-- <div class="top clearfix"> -->
    <div class="top">    
        <div class="left"></div>
        <div class="right"></div>
        <!-- <div class="clearfix"></div> -->
    </div>
    <div class="bottom"></div>
 </body>
 </html>
