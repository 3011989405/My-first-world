<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位居中</title>
    <style>
        img{
            position: absolute;
            left: 50%;
            top: 50%;

            /* margin-left: -88.5px;
            margin-top: -27.5px;  */
            /* 方便：50%就是他自己宽高的一半 */
            transform: translate(-50%,-50%); 
        }
    </style>
</head>
<body>
    <img src="./01-标签的写法/屏幕截图 2026-07-02 163326.png" alt="">
</body>
</html>
