<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子选择器</title>
    <style>
        div > span{
            color: red;
        }
    </style>
</head>
<body>
    <div>
        <span>div的span</span>
        <p>
            <span>div里p的span</span>
        </p>
    </div>
</body>
</html>
