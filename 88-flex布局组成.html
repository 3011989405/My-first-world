<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex布局</title>
    <style>
        /* 弹性容器 */
        .box{
            display: flex;
            height: 300px;
            border: 1px solid #000;
        }
        /* 弹性盒子：沿着主轴方向排列 */
        .box div{
            width: 200px;
            /* height: 100px; */
            background-color: pink
        }
    </style>
</head>
<body>
    <div class="box">
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
    </div>
</body>
</html>
