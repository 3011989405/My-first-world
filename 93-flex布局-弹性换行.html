<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex布局-弹性换行</title>
    <style>
        .box{
            display: flex;
            /* 换行 */
            flex-wrap: wrap;
            /* 不换行 */
            /* flex-wrap: nowrap; */

            justify-content: space-between;

            height: 300px;
            border: 1px solid #000;
        }
        .box div{
            width: 200px;
            height: 100px;
            background-color: pink
        }
    </style>
</head>
<body>
    <div class="box">
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
        <div>测试标签4</div>
        <div>测试标签5</div>
        <div>测试标签6</div>
        <div>测试标签7</div>
        <div>测试标签8</div>
        <div>测试标签9</div>
        <div>测试标签10</div>
        <div>测试标签11</div>
        <div>测试标签12</div>
    </div>
</body>
</html>
