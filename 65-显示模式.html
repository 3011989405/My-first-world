<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>显示模式</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            display: inline;
        }
        .div1{
            background-color: blue;
        }
        .div2{
            background-color: orange;
        }
        /* 行内：一行共存多个：尺寸由内容撑开：加宽高不生效*/
        span{
            width: 200px;
            height: 200px;
        }
        .span1{
            background-color:brown;
        }
        .span2{
            background-color: orange;
        }
        img{
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <!-- 块元素 -->
    <div class="div1">dic 测试标签</div>
    <div class="div2">dic 测试标签</div>
    <!-- 行内元素 -->
    <span class="span1">span11111111</span>
    <span class="span2">span1</span>
    <!-- 行内块元素 -->
     <img src="./屏幕截图 2026-07-02 163326.png" alt="">
     <img src="./屏幕截图 2026-07-02 163326.png" alt="">
</body>
</html>
