<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>94-flex布局-换行方式</title>
    <style>
        .box{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            /* 调整 对齐方式:对单行弹性盒子不生效 */
            /* align-content: flex-start; */
            /* align-content: flex-end; */
            /* align-content: center; */
            /* align-content: space-between; */
            /* align-content: space-around; */
            /* 没有代码提示 */
            align-content: space-evenly;

            height: 400px;
            border: 1px solid #000;
        }

        .box div{
            width: 200px;
            height: 100px;
            background-color: pink
        }
    </style>
</head>
<body>
    <div class="box">
        <div>测试标签1</div>
        <div>测试标签2</div>
        <div>测试标签3</div>
        <div>测试标签4</div>
        <div>测试标签5</div>
        <div>测试标签6</div>
        <div>测试标签7</div>
        <div>测试标签8</div>
    </div>
</body>
</html>
