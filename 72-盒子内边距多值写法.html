<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子内边距多值写法</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            background-color: pink;

            /* 四值写法 */
            /* padding: 10px 20px 40px 80px; */
            /* 两值写法，上10px，左右都是40px，下是80px */
            /* padding: 10px 40px 80px; */
            /* 两值写法，上下，左右*/
            padding: 10px 40px;
        }
    </style>
</head>
<body>
    <div>测试标签</div>
</body>
</html>
